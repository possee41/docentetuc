name: Notices reminders via Worker
on:
  # DISABLED schedule template. Add only after explicit production authorization.
  # schedule:
  #   - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Máximo de recordatorios (nunca más de dos)'
        type: choice
        options: ['1', '2']
        default: '2'
      acknowledge_failure:
        description: 'Confirmar revisión del fallo anterior antes de otra llamada (no es un reintento automático)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: notices-reminders
  cancel-in-progress: false
jobs:
  reminders:
    if: >-
      vars.NOTICES_AUTOMATION_ENABLED == 'true' &&
      github.repository == 'possee41/docentetuc' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/1.2-sync-integration') ||
       (github.event_name == 'schedule' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    environment: notices-pilot
    timeout-minutes: 5
    steps:
      - name: Verify approved revision
        env:
          NOTICES_REF: ${{ vars.NOTICES_REF }}
        run: |
          [[ "$NOTICES_REF" =~ ^[a-f0-9]{40}$ ]] || { echo 'NOTICES_REF must be an approved commit SHA'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.NOTICES_REF }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify checked-out revision
        env:
          NOTICES_REF: ${{ vars.NOTICES_REF }}
        run: test "$(git rev-parse HEAD)" = "$NOTICES_REF"
      - name: Materialize bounded reminders
        env:
          NOTICES_AUTOMATION_ENABLED: ${{ vars.NOTICES_AUTOMATION_ENABLED }}
          NOTICES_IMPORT_URL: ${{ vars.NOTICES_IMPORT_URL }}
          NOTICES_IMPORT_SECRET: ${{ secrets.NOTICES_IMPORT_SECRET }}
          NOTICES_LIMIT: ${{ inputs.limit || '2' }}
          NOTICES_ACKNOWLEDGE_FAILURE: ${{ inputs.acknowledge_failure && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/reminders-worker.mjs
