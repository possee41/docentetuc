name: Juntas external import pilot
on:
  # Programación propuesta, DESACTIVADA hasta validar gateway, corte legacy y cuotas:
  # Incluye Padrones, Comunicados y Llamados; no duplicar esos trabajos.
  # Propuesta diaria DESACTIVADA: 08:07 Tucumán (UTC-3). Ver docs/1.2-daily-sources.md.
  # schedule: [{ cron: '7 11 * * *' }]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: juntas-import-pilot
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'possee41/docentetuc' && github.ref == 'refs/heads/feat/1.2-sync-integration' && vars.JUNTAS_GATEWAY_ALLOWED == 'true'
    runs-on: ubuntu-latest
    environment: juntas-pilot
    timeout-minutes: 30
    steps:
      - name: Verify approved revision
        env:
          IMPORT_REF: ${{ vars.JUNTAS_IMPORT_REF }}
        run: |
          [[ "$IMPORT_REF" =~ ^[a-f0-9]{40}$ ]] || { echo 'JUNTAS_IMPORT_REF must be an approved commit SHA'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.JUNTAS_IMPORT_REF }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify approved revision
        env:
          IMPORT_REF: ${{ vars.JUNTAS_IMPORT_REF }}
        run: |
          test "$(git rev-parse HEAD)" = "$IMPORT_REF"
          git merge-base --is-ancestor d321e7225e7dc75ff76a0e612525386855e05e08 HEAD
      - name: Import public Junta notices and references through isolated gateway
        env:
          IMPORT_GATEWAY_ENABLED: 'true'
          SYNC_SOURCE: juntas
          JUNTAS_MAX_REQUESTS: '25'
          JUNTAS_MAX_PUBLICATION_WRITES: '20'
          IMPORT_GATEWAY_ORIGIN: ${{ vars.IMPORT_GATEWAY_ORIGIN }}
          IMPORT_GATEWAY_DATABASE_ID: ${{ vars.IMPORT_GATEWAY_DATABASE_ID }}
          IMPORT_GATEWAY_DATABASE_NAME: ${{ vars.IMPORT_GATEWAY_DATABASE_NAME }}
          JUNTAS_IMPORT_SECRET: ${{ secrets.JUNTAS_IMPORT_SECRET }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: node --experimental-strip-types scripts/import-via-gateway.mjs
