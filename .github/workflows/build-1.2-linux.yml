name: DocenteTuc 1.2 Linux build (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-1-2-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'possee41/docentetuc' && github.ref == 'refs/heads/feat/1.2-sync-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install project package manager
        run: npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm exec tsc --noEmit
      - name: Build web and prepare Worker, without deployment
        run: pnpm build
