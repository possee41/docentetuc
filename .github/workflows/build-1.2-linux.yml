name: DocenteTuc 1.2 Linux build (isolated branch)
on:
  push:
    branches: [feat/1.2-sync-integration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-1-2-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'possee41/docentetuc' && github.ref == 'refs/heads/feat/1.2-sync-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install project package manager
        run: npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm exec tsc --noEmit
      - name: Build web and prepare Worker, without deployment
        run: pnpm build
      - name: Verify news migrations in ephemeral D1
        run: node scripts/verify-news-migrations-d1.mjs
      - name: Verify durable publication events in ephemeral D1
        run: node scripts/verify-external-events-d1.mjs
      - name: Verify notification event recovery
        run: node --experimental-strip-types --test lib/external-publication-events.test.ts lib/external-reminder-push.test.ts
