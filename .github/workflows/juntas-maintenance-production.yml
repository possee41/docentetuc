# Prepared only: publish/credentials/first import/daily enable each require authorization.
name: Juntas production maintenance
on:
  # schedule: [{ cron: '7 11 * * *' }] # 08:07 Tucuman; NOT ACTIVE
  workflow_dispatch:
    inputs:
      acknowledge_failed_run:
        description: 'Only after inspecting a failed/cancelled previous run; exact run ID'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: daily-production-source-writes
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'possee41/docentetuc' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.JUNTAS_PRODUCTION_ENABLED == 'true' && github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.JUNTAS_DAILY_ENABLED == 'true'))
    runs-on: ubuntu-latest
    outputs:
      runtime_sha: ${{ steps.validate.outputs.runtime_sha }}
    # No Environment here: GET must prove it exists before a job references it.
    steps:
      - uses: actions/github-script@v7
        id: validate
        env:
          JUNTAS_APPROVED_SHA: ${{ vars.JUNTAS_APPROVED_SHA }}
          JUNTAS_SCHEMA_READY: ${{ vars.JUNTAS_SCHEMA_READY }}
          ACK_FAILED_RUN: ${{ inputs.acknowledge_failed_run }}
        with:
          script: |
            const {owner,repo}=context.repo;
            if(!/^[a-f0-9]{40}$/.test(process.env.JUNTAS_APPROVED_SHA||'') || process.env.JUNTAS_SCHEMA_READY!=='true')throw Error('JUNTAS_NOT_READY');
            if(context.eventName==='workflow_dispatch'&&(context.actor!=='possee41'||String(context.payload.sender.id)!=='296786704'))throw Error('OWNER_REQUIRED');
            const {data:env}=await github.rest.repos.getEnvironment({owner,repo,environment_name:'juntas-production'});
            if(env.can_admins_bypass!==false || !env.deployment_branch_policy?.custom_branch_policies || env.deployment_branch_policy?.protected_branches)throw Error('ENVIRONMENT_PROTECTION_INVALID');
            const {data:branches}=await github.rest.repos.listDeploymentBranchPolicies({owner,repo,environment_name:'juntas-production',per_page:100});
            if(branches.total_count!==1||branches.branch_policies[0].name!==context.payload.repository.default_branch||branches.branch_policies[0].type!=='branch')throw Error('ENVIRONMENT_BRANCH_INVALID');
            if(context.eventName==='schedule'&&env.protection_rules?.some(r=>r.type==='required_reviewers'))throw Error('SCHEDULE_REQUIRES_UNATTENDED_POLICY_APPROVAL');
            const {data:history}=await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'juntas-maintenance-production.yml',per_page:20});
            const prior=history.workflow_runs.find(r=>r.id!==context.runId);
            if(prior&&prior.conclusion!=='success'&&!(context.eventName==='workflow_dispatch'&&process.env.ACK_FAILED_RUN===String(prior.id)))throw Error('PREVIOUS_RUN_REQUIRES_REVIEW');
            core.setOutput('runtime_sha',process.env.JUNTAS_APPROVED_SHA);
  maintain:
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    environment: juntas-production
    timeout-minutes: 11
    env:
      JUNTAS_PRODUCTION_ENABLED: ${{ vars.JUNTAS_PRODUCTION_ENABLED }}
      JUNTAS_DAILY_ENABLED: ${{ vars.JUNTAS_DAILY_ENABLED }}
      JUNTAS_SCHEMA_READY: ${{ vars.JUNTAS_SCHEMA_READY }}
      JUNTAS_APPROVED_SHA: ${{ needs.preflight.outputs.runtime_sha }}
      JUNTAS_RECEIVER_ORIGIN: https://docentetuc-juntas-1-2.possee41.workers.dev
      JUNTAS_DATABASE_ID: baaf5886-0123-4948-96da-aa7106424549
      JUNTAS_DATABASE_NAME: docentetuc-db
      JUNTAS_IMPORT_SECRET: ${{ secrets.JUNTAS_IMPORT_SECRET }}
      GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.runtime_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify immutable runtime
        run: test "$(git rev-parse HEAD)" = "$JUNTAS_APPROVED_SHA"
      - name: One bounded collection with ACK and mandatory close
        run: node --experimental-strip-types scripts/juntas-production.mjs
      - name: Independent idempotent closure, including failures
        if: always()
        run: node --experimental-strip-types scripts/juntas-production.mjs --close
