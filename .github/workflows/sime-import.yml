name: SIME external import pilot
on:
  # Programación propuesta, DESACTIVADA hasta validar gateway, corte legacy y cuotas:
  # schedule: [{ cron: '12 * * * *' }]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sime-import-pilot
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'possee41/docentetuc' && github.ref == 'refs/heads/feat/1.2-sync-integration'
    runs-on: ubuntu-latest
    environment: sime-pilot
    timeout-minutes: 15
    steps:
      - name: Verify approved revision
        env:
          IMPORT_REF: ${{ vars.SIME_IMPORT_REF }}
        run: |
          [[ "$IMPORT_REF" =~ ^[a-f0-9]{40}$ ]] || { echo 'SIME_IMPORT_REF must be an approved commit SHA'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.SIME_IMPORT_REF }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify approved revision
        env:
          IMPORT_REF: ${{ vars.SIME_IMPORT_REF }}
        run: |
          test "$(git rev-parse HEAD)" = "$IMPORT_REF"
          git merge-base --is-ancestor d321e7225e7dc75ff76a0e612525386855e05e08 HEAD
      - name: Import public SIME listings through isolated gateway
        env:
          IMPORT_GATEWAY_ENABLED: 'true'
          SYNC_SOURCE: sime
          IMPORT_GATEWAY_ORIGIN: ${{ vars.IMPORT_GATEWAY_ORIGIN }}
          IMPORT_GATEWAY_DATABASE_ID: ${{ vars.IMPORT_GATEWAY_DATABASE_ID }}
          IMPORT_GATEWAY_DATABASE_NAME: ${{ vars.IMPORT_GATEWAY_DATABASE_NAME }}
          SIME_IMPORT_SECRET: ${{ secrets.SIME_IMPORT_SECRET }}
        run: node --experimental-strip-types scripts/import-via-gateway.mjs
