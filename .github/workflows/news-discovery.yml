name: News discovery (disabled)
on:
  # schedule: [{ cron: '47 11 * * *' }] # 08:47 Tucumán; disabled pending authorization
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate configuration only; no source queries or writes'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: daily-public-source-writes
  cancel-in-progress: false
jobs:
  discover:
    if: >-
      github.repository == 'possee41/docentetuc' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/daily-sync-358112c' &&
      vars.DAILY_CANARY_TEST_ENABLED == 'true' && vars.NEWS_CANARY_TEST_ENABLED == 'true' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: canary-news-discovery
    timeout-minutes: 10
    permissions:
      contents: write # Repository-wide, not branch-scoped. Requires approval before publication.
    env:
      GH_TOKEN: ${{ github.token }}
      DAILY_SOURCES_ENABLED: ${{ vars.DAILY_CANARY_TEST_ENABLED }}
      DAILY_APPROVED_SHA: ${{ vars.DAILY_APPROVED_SHA }}
      NEWS_DISCOVERY_ORIGIN: https://canary.docentetuc.com.ar
      NEWS_DISCOVERY_SECRET: ${{ secrets.NEWS_DISCOVERY_SECRET }}
      NEWS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.DAILY_APPROVED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify dependency closure and isolated target
        run: node --experimental-strip-types scripts/verify-sync-publication.mjs
      - name: Collect feeds in Node and send articles to candidate-only receiver
        run: node --experimental-strip-types scripts/news-via-receiver.mjs
