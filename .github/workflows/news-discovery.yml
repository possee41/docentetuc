name: News discovery Canary (manual)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: daily-public-source-writes
  cancel-in-progress: false
jobs:
  discover:
    if: github.repository == 'possee41/docentetuc' && github.ref == 'refs/heads/release/news-canary' && github.event_name == 'workflow_dispatch' && vars.NEWS_CANARY_TEST_ENABLED == 'true' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: canary-news-discovery
    timeout-minutes: 10
    permissions:
      contents: write # Repository-wide; state writes guarded by approved SHA and CAS.
    env:
      GH_TOKEN: ${{ github.token }}
      DAILY_SOURCES_ENABLED: ${{ vars.NEWS_CANARY_TEST_ENABLED }}
      DAILY_APPROVED_SHA: ${{ vars.NEWS_CANARY_APPROVED_SHA }}
      NEWS_DISCOVERY_ORIGIN: https://docentetuc-news-canary-1-2.possee41.workers.dev
      NEWS_DISCOVERY_SECRET: ${{ secrets.IMPORT_SECRET }}
      NEWS_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      IMPORT_GATEWAY_TARGET: canary
      IMPORT_GATEWAY_ORIGIN: https://docentetuc-news-canary-1-2.possee41.workers.dev
      IMPORT_GATEWAY_DATABASE_ID: 853e2f5d-89b1-46a3-9c1c-5cbd46784756
      IMPORT_GATEWAY_DATABASE_NAME: docentetuc-web-canary-1-2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.NEWS_CANARY_APPROVED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect feeds in Node and persist at most five candidates
        run: node --experimental-strip-types scripts/news-via-receiver.mjs
