name: News discovery (disabled)
on:
  # schedule: [{ cron: '47 11 * * *' }] # 08:47 Tucumán; disabled pending authorization
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate configuration only; no source queries or writes'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: daily-public-source-writes
  cancel-in-progress: false
jobs:
  discover:
    if: >-
      github.repository == 'possee41/docentetuc' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.DAILY_SOURCES_ENABLED == 'true' && vars.NEWS_DISCOVERY_ENABLED == 'true' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: news-discovery
    timeout-minutes: 10
    permissions:
      contents: write # Repository-wide, not branch-scoped. Requires approval before publication.
    env:
      GH_TOKEN: ${{ github.token }}
      DAILY_SOURCES_ENABLED: ${{ vars.DAILY_SOURCES_ENABLED }}
      DAILY_APPROVED_SHA: ${{ vars.DAILY_APPROVED_SHA }}
      DAILY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DAILY_PRODUCTION_APPROVED: ${{ vars.DAILY_PRODUCTION_APPROVED }}
      NEWS_DISCOVERY_ORIGIN: ${{ vars.NEWS_DISCOVERY_ORIGIN }}
      NEWS_DISCOVERY_SECRET: ${{ secrets.NEWS_DISCOVERY_SECRET }}
      NEWS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.DAILY_APPROVED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect feeds in Node and send articles to candidate-only receiver
        run: node --experimental-strip-types scripts/news-via-receiver.mjs
