name: Production daily sources
on:
  schedule:
    - cron: '7 9 * * *'
    - cron: '7 10 * * *'
    - cron: '37 10 * * *'
  workflow_dispatch:
    inputs:
      source:
        type: choice
        options: [sime, infd, cenet]
        required: true
permissions:
  contents: read
concurrency:
  group: daily-production-source-writes
  cancel-in-progress: false
jobs:
  sync:
    if: >-
      github.repository == 'possee41/docentetuc' &&
      github.ref == 'refs/heads/fix/navigation-community-1.1' &&
      github.run_attempt == 1 &&
      vars.DAILY_PRODUCTION_ENABLED == 'true' && vars.DAILY_PRODUCTION_APPROVED == 'true' &&
      (
        (((github.event_name == 'schedule' && github.event.schedule == '7 9 * * *') || (github.event_name == 'workflow_dispatch' && inputs.source == 'sime')) && vars.DAILY_PRODUCTION_SIME_ENABLED == 'true') ||
        (((github.event_name == 'schedule' && github.event.schedule == '7 10 * * *') || (github.event_name == 'workflow_dispatch' && inputs.source == 'infd')) && vars.DAILY_PRODUCTION_INFD_ENABLED == 'true') ||
        (((github.event_name == 'schedule' && github.event.schedule == '37 10 * * *') || (github.event_name == 'workflow_dispatch' && inputs.source == 'cenet')) && vars.DAILY_PRODUCTION_CENET_ENABLED == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Repository-wide; the runtime confines ledger writes to fixed production branches with CAS.
    environment: ${{ format('production-{0}', inputs.source || (github.event.schedule == '7 9 * * *' && 'sime') || (github.event.schedule == '7 10 * * *' && 'infd') || (github.event.schedule == '37 10 * * *' && 'cenet')) }}
    env:
      DAILY_SOURCES_ENABLED: ${{ vars.DAILY_PRODUCTION_ENABLED }}
      DAILY_APPROVED_SHA: ${{ vars.DAILY_PRODUCTION_APPROVED_SHA }}
      DAILY_DEFAULT_BRANCH: fix/navigation-community-1.1
      DAILY_STATE_ENVIRONMENT: production
      DAILY_EVENT_NAME: ${{ github.event_name }}
      DAILY_EVENT_SCHEDULE: ${{ github.event.schedule }}
      DAILY_REQUESTED_SOURCE: ${{ inputs.source }}
      SYNC_SOURCE: ${{ inputs.source || (github.event.schedule == '7 9 * * *' && 'sime') || (github.event.schedule == '7 10 * * *' && 'infd') || (github.event.schedule == '37 10 * * *' && 'cenet') }}
      IMPORT_GATEWAY_TARGET: production
      IMPORT_GATEWAY_PRODUCTION_ENABLED: ${{ vars.DAILY_PRODUCTION_APPROVED }}
      IMPORT_GATEWAY_APPROVED_SHA: ${{ vars.DAILY_PRODUCTION_APPROVED_SHA }}
      IMPORT_GATEWAY_ORIGIN: https://docentetuc-sources-1-2.possee41.workers.dev
      IMPORT_GATEWAY_DATABASE_ID: baaf5886-0123-4948-96da-aa7106424549
      IMPORT_GATEWAY_DATABASE_NAME: docentetuc-db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e7fc12fe3454f865b53c0c45f36b5568653dc02c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact schedule mapping and immutable approved runtime
        run: |
          node --input-type=module <<'NODE'
          // BEGIN_EVENT_VALIDATION
          const map = {'7 9 * * *':'sime','7 10 * * *':'infd','37 10 * * *':'cenet'};
          const source = process.env.DAILY_EVENT_NAME === 'schedule' ? map[process.env.DAILY_EVENT_SCHEDULE] :
            process.env.DAILY_EVENT_NAME === 'workflow_dispatch' ? process.env.DAILY_REQUESTED_SOURCE : null;
          if (!['sime','infd','cenet'].includes(source) || source !== process.env.SYNC_SOURCE)
            throw Error('DAILY_EVENT_NOT_APPROVED');
          if (process.env.DAILY_APPROVED_SHA !== 'e7fc12fe3454f865b53c0c45f36b5568653dc02c')
            throw Error('DAILY_RUNTIME_SHA_MISMATCH');
          console.log(JSON.stringify({source,event:process.env.DAILY_EVENT_NAME,runtime:process.env.DAILY_APPROVED_SHA}));
          // END_EVENT_VALIDATION
          NODE
      - name: Synchronize one bounded source and close its temporary lease
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY_IMPORT_SECRET: ${{ secrets.IMPORT_SECRET }}
        run: node --experimental-strip-types scripts/daily-sources.mjs
