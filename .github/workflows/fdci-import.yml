name: FDCI external import
on:
  # Programación propuesta, DESACTIVADA hasta validar REST, corte legacy y cuotas:
  # schedule: [{ cron: '17 * * * *' }]
  workflow_dispatch:
    inputs:
      scope:
        description: 'Una comisión, comisiones activas o barrido completo'
        required: true
        type: choice
        default: single
        options: [single, active, full]
      course_token:
        description: 'Token público del curso FDCI'
        required: false
        type: string
      course_slug:
        description: 'Slug público del curso FDCI'
        required: false
        type: string
      commission_id:
        description: 'ID público de una comisión a importar'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: fdci-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'possee41/docentetuc' && github.ref == 'refs/heads/feat/1.2-sync-integration'
    runs-on: ubuntu-latest
    environment: fdci-pilot
    timeout-minutes: 10
    steps:
      - name: Verify approved import revision
        env:
          IMPORT_REF: ${{ vars.FDCI_IMPORT_REF }}
        run: |
          [[ "$IMPORT_REF" =~ ^[a-f0-9]{40}$ ]] || { echo 'FDCI_IMPORT_REF must be an approved commit SHA'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.FDCI_IMPORT_REF }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production ancestry
        env:
          IMPORT_REF: ${{ vars.FDCI_IMPORT_REF }}
        run: |
          test "$(git rev-parse HEAD)" = "$IMPORT_REF"
          git merge-base --is-ancestor d321e7225e7dc75ff76a0e612525386855e05e08 HEAD
      - name: Import public FDCI data into isolated D1 by REST
        env:
          DIRECT_D1_WRITE_ENABLED: 'true'
          SYNC_SOURCE: fdci
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_IMPORT_TOKEN: ${{ secrets.D1_IMPORT_TOKEN }}
          FDCI_COURSE_TOKEN: ${{ inputs.course_token }}
          FDCI_COURSE_SLUG: ${{ inputs.course_slug }}
          FDCI_COMMISSION_ID: ${{ inputs.commission_id }}
          FDCI_SCOPE: ${{ inputs.scope }}
        run: node --experimental-strip-types scripts/import-direct-d1.mjs
