name: FDCI external import
on:
  # Programación propuesta, DESACTIVADA. Frecuencia inicial cada 2 horas:
  # cubre ventanas de inscripción y cambios de cupo con 12 corridas diarias.
  # Al habilitarla, el job exige FDCI_AUTOMATION_ENABLED=true, usa scope=active
  # y abre una compuerta autolimitada que expira aunque el runner no la cierre.
  # schedule: [{ cron: '17 */2 * * *' }]
  workflow_dispatch:
    inputs:
      scope:
        description: 'Una comisión, comisiones activas o barrido completo'
        required: true
        type: choice
        default: single
        options: [single, active, full]
      course_token:
        description: 'Token público del curso FDCI'
        required: false
        type: string
      course_slug:
        description: 'Slug público del curso FDCI'
        required: false
        type: string
      commission_id:
        description: 'ID público de una comisión a importar'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: fdci-import
  cancel-in-progress: false
jobs:
  import:
    # Manual runs stay on the isolated branch. A future scheduled run must come
    # from the default branch and remain opt-in through FDCI_AUTOMATION_ENABLED.
    if: >-
      github.repository == 'possee41/docentetuc' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/1.2-sync-integration') ||
       (github.event_name == 'schedule' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        vars.FDCI_AUTOMATION_ENABLED == 'true'))
    runs-on: ubuntu-latest
    environment: fdci-pilot
    timeout-minutes: 10
    steps:
      - name: Verify approved import revision
        env:
          IMPORT_REF: ${{ vars.FDCI_IMPORT_REF }}
        run: |
          [[ "$IMPORT_REF" =~ ^[a-f0-9]{40}$ ]] || { echo 'FDCI_IMPORT_REF must be an approved commit SHA'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.FDCI_IMPORT_REF }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production ancestry
        env:
          IMPORT_REF: ${{ vars.FDCI_IMPORT_REF }}
        run: |
          test "$(git rev-parse HEAD)" = "$IMPORT_REF"
          git merge-base --is-ancestor d321e7225e7dc75ff76a0e612525386855e05e08 HEAD
      - name: Open self-expiring FDCI gate
        timeout-minutes: 2
        env:
          IMPORT_GATEWAY_ENABLED: 'true'
          SYNC_SOURCE: fdci
          IMPORT_GATEWAY_ORIGIN: ${{ vars.IMPORT_GATEWAY_ORIGIN }}
          FDCI_IMPORT_SECRET: ${{ secrets.FDCI_IMPORT_SECRET }}
          IMPORT_GATE_TTL_SECONDS: '600'
          IMPORT_GATE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node --experimental-strip-types scripts/import-gate.mjs open
      - name: Import public FDCI data through isolated gateway
        env:
          IMPORT_GATEWAY_ENABLED: 'true'
          SYNC_SOURCE: fdci
          IMPORT_GATEWAY_ORIGIN: ${{ vars.IMPORT_GATEWAY_ORIGIN }}
          IMPORT_GATEWAY_DATABASE_ID: ${{ vars.IMPORT_GATEWAY_DATABASE_ID }}
          IMPORT_GATEWAY_DATABASE_NAME: ${{ vars.IMPORT_GATEWAY_DATABASE_NAME }}
          FDCI_IMPORT_SECRET: ${{ secrets.FDCI_IMPORT_SECRET }}
          FDCI_COURSE_TOKEN: ${{ inputs.course_token }}
          FDCI_COURSE_SLUG: ${{ inputs.course_slug }}
          FDCI_COMMISSION_ID: ${{ inputs.commission_id }}
          FDCI_SCOPE: ${{ github.event_name == 'schedule' && 'active' || inputs.scope }}
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/import-via-gateway.mjs | tee fdci-import.json
      - name: Close FDCI gate
        if: always()
        timeout-minutes: 2
        env:
          IMPORT_GATEWAY_ENABLED: 'true'
          SYNC_SOURCE: fdci
          IMPORT_GATEWAY_ORIGIN: ${{ vars.IMPORT_GATEWAY_ORIGIN }}
          FDCI_IMPORT_SECRET: ${{ secrets.FDCI_IMPORT_SECRET }}
          IMPORT_GATE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node --experimental-strip-types scripts/import-gate.mjs close
      - name: Record FDCI result
        if: always()
        run: |
          {
            echo "### FDCI import"
            echo "- event: ${{ github.event_name }}"
            echo "- date: $(date -u +%FT%TZ)"
            if [ -f fdci-import.json ]; then
              node -e 'const r=JSON.parse(require("fs").readFileSync("fdci-import.json","utf8"));const n=(v)=>"number"==typeof v?v:"?";console.log([`- discovered: ${n(r.discovered)}`,`- created: ${n(r.created)}`,`- updated: ${n(r.updated)}`,`- unchanged: ${n(r.unchanged)}`,`- rejected: ${n(r.rejected)}`].join("\n"))'
            else
              echo "- sin resultado: la compuerta o la importación fallaron"
            fi
            echo "- complete sweep claimed: no"
          } >> "$GITHUB_STEP_SUMMARY"
