name: FDCI external import
on:
  # Proposed schedule, DISABLED; requires new approval and a fixed authorized SHA.
  # OBSOLETO PARA PROGRAMACIÓN: no activar este camino al gateway FDCI HALTED.
  # La propuesta diaria 06:37 Tucumán (37 9 * * *) corresponde exclusivamente
  # al runner estático durable del repositorio docentetuc-fdci-catalog-pilot.
  # Ver docs/1.2-daily-sources.md. No agregar schedule aquí.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fdci-import
  cancel-in-progress: false
jobs:
  import:
    if: >-
      github.repository == 'possee41/docentetuc' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/1.2-sync-integration') ||
       (github.event_name == 'schedule' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        vars.FDCI_AUTOMATION_ENABLED == 'true'))
    runs-on: ubuntu-latest
    environment: fdci-pilot
    timeout-minutes: 12
    env:
      IMPORT_GATEWAY_ENABLED: 'true'
      SYNC_SOURCE: fdci
      IMPORT_GATEWAY_TARGET: ${{ vars.IMPORT_GATEWAY_TARGET }}
      IMPORT_GATEWAY_PRODUCTION_ENABLED: ${{ vars.IMPORT_GATEWAY_PRODUCTION_ENABLED }}
      IMPORT_GATEWAY_APPROVED_SHA: ${{ vars.FDCI_IMPORT_APPROVED_SHA }}
      IMPORT_GATEWAY_ORIGIN: ${{ vars.IMPORT_GATEWAY_ORIGIN }}
      IMPORT_GATEWAY_DATABASE_ID: ${{ vars.IMPORT_GATEWAY_DATABASE_ID }}
      IMPORT_GATEWAY_DATABASE_NAME: ${{ vars.IMPORT_GATEWAY_DATABASE_NAME }}
      IMPORT_GATE_TTL_SECONDS: '600'
      IMPORT_GATE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      FDCI_SCOPE: active
      FDCI_MAX_REQUESTS: '6'
      # The runner caps examined commissions too; retain the production pilot bound.
      FDCI_MAX_PUBLICATIONS: '2'
      FDCI_PAUSE_MS: '400'
    steps:
      - name: Verify separately approved revision
        env:
          IMPORT_REF: ${{ vars.FDCI_IMPORT_REF }}
          APPROVED_SHA: ${{ vars.FDCI_IMPORT_APPROVED_SHA }}
        run: |
          [[ "$IMPORT_REF" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test "$IMPORT_REF" = "$APPROVED_SHA"
          [[ "$IMPORT_GATEWAY_TARGET" == canary || "$IMPORT_GATEWAY_TARGET" == production ]] || exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.FDCI_IMPORT_REF }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify checked out revision
        env:
          IMPORT_REF: ${{ vars.FDCI_IMPORT_REF }}
        run: test "$(git rev-parse HEAD)" = "$IMPORT_REF"
      - name: Validate destination and identity before opening
        id: preflight
        env:
          FDCI_IMPORT_SECRET: ${{ secrets.FDCI_IMPORT_SECRET }}
        run: node --experimental-strip-types scripts/import-gate.mjs preflight
      - name: Open, import and close with one owner
        id: dispatch
        timeout-minutes: 5
        env:
          FDCI_IMPORT_SECRET: ${{ secrets.FDCI_IMPORT_SECRET }}
        # Reuses scripts/import-via-gateway.mjs; no direct D1 credentials.
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/import-gate.mjs run | tee fdci-import.json
      - name: Close FDCI gate after interruption or failure
        id: cleanup
        if: always() && steps.preflight.outcome == 'success' && steps.dispatch.outcome != 'skipped'
        timeout-minutes: 2
        env:
          FDCI_IMPORT_SECRET: ${{ secrets.FDCI_IMPORT_SECRET }}
        run: node --experimental-strip-types scripts/import-gate.mjs close
      - name: Record FDCI result
        if: always()
        env:
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          let r = {};
          try { r = JSON.parse(readFileSync('fdci-import.json', 'utf8')); } catch {}
          console.log('### FDCI import');
          console.log('- status: ' + (['OK','PARTIAL','ERROR'].includes(r.status) ? r.status : 'NO_RESULT'));
          for (const key of ['discovered','created','updated','unchanged','rejected','skipped','deferred','uncertain','sourceRequests','elapsedMs'])
            console.log('- ' + key + ': ' + (Number.isSafeInteger(r[key]) && r[key] >= 0 ? r[key] : 'unavailable'));
          for (const key of ['code','closeCode']) if (/^[A-Z_0-9]+$/.test(r[key] || '')) console.log('- ' + key + ': ' + r[key]);
          if (r.cursor && Number.isSafeInteger(r.cursor.cycle) && Number.isSafeInteger(r.cursor.revision)) console.log('- cycle/revision: ' + r.cursor.cycle + '/' + r.cursor.revision);
          console.log('- cycleComplete: ' + (r.cycleComplete === true));
          console.log('- cleanup: ' + process.env.CLEANUP_OUTCOME);
          console.log('- complete sweep claimed: no');
          NODE
